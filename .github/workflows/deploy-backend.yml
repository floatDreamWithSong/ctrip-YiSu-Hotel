name: Deploy Backend to Server

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      # 统一生成小写镜像仓库名（GHCR 要求 repository name 全小写）
      - name: Compute image repository
        id: image_meta
        run: |
          echo "image_repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ctrip-yisu-hotel-backend" >> "$GITHUB_OUTPUT"

      # 构建并推送后端镜像
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.image_meta.outputs.image_repo }}:${{ env.IMAGE_TAG }}
            ${{ steps.image_meta.outputs.image_repo }}:latest

      # 设置 SSH 密钥
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.PRIVATE_KEY }}

      # 确保服务器目录存在
      - name: Prepare remote directory
        run: |
          ssh -p ${{ secrets.REMOTE_PORT }} \
            -o StrictHostKeyChecking=no \
            ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} \
            "mkdir -p ${{ secrets.TARGET }}/backend"

      # 同步部署所需文件到服务器
      - name: Sync compose files to server
        run: |
          rsync -avz \
            -e "ssh -p ${{ secrets.REMOTE_PORT }} -o StrictHostKeyChecking=no" \
            backend/docker-compose.yml \
            backend/nginx.conf \
            ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}:${{ secrets.TARGET }}/backend/

      # VPS 拉取新镜像并重启
      - name: Deploy via Docker Compose (pull only)
        run: |
          ssh -p ${{ secrets.REMOTE_PORT }} \
            -o StrictHostKeyChecking=no \
            ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} \
            "echo '${{ secrets.GHCR_TOKEN }}' | docker login ghcr.io -u '${{ secrets.GHCR_USERNAME }}' --password-stdin \
            && cd ${{ secrets.TARGET }}/backend \
            && APP_IMAGE=${{ steps.image_meta.outputs.image_repo }}:${{ env.IMAGE_TAG }} docker compose pull app \
            && APP_IMAGE=${{ steps.image_meta.outputs.image_repo }}:${{ env.IMAGE_TAG }} docker compose up -d --remove-orphans"
