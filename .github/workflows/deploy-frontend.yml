name: Deploy Frontend to COS and Refresh CDN

on:
  push:
    branches:
      - dev

env:
  COS_MOBILE_BUCKET: yisu-mobile-1305081043
  COS_ADMIN_BUCKET: yisu-admin-1305081043
  COS_REGION: na-siliconvalley
  CDN_MOBILE_DOMAIN: yisu-mobile.daydreamer.net.cn
  CDN_ADMIN_DOMAIN: yisu-admin.daydreamer.net.cn
  MOBILE_OUTPUT_DIR: frontend/mobile/dist
  ADMIN_OUTPUT_DIR: frontend/admin/dist

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Ensure pnpm (pnpm/action-setup)
        uses: pnpm/action-setup@v4

      - name: Install dependencies & build
        run: |
          set -e
          pnpm install --frozen-lockfile
          pnpm build -F mobile -F admin

      - name: Upload mobile artifact to COS
        uses: TencentCloud/cos-action@v1
        with:
          secret_id: ${{ secrets.COS_SECRET_ID }}
          secret_key: ${{ secrets.COS_SECRET_KEY }}
          cos_bucket: ${{ env.COS_MOBILE_BUCKET }}
          cos_region: ${{ env.COS_REGION }}
          local_path: ${{ env.MOBILE_OUTPUT_DIR }}
          remote_path: /
          clean: true

      - name: Refresh mobile CDN
        uses: xh-polaris/tencent-cloud-cli-action@v1
        with:
          secret_id: ${{ secrets.COS_SECRET_ID }}
          secret_key: ${{ secrets.COS_SECRET_KEY }}
          region: ${{ env.COS_REGION }}
          commands: >
            cdn PurgePathCache --cli-unfold-argument --Paths https://${{ env.CDN_MOBILE_DOMAIN }}/ --FlushType delete
          output_format: json
