pre-push:
  parallel: true
  commands:
    admin-format:
      glob: "frontend/admin/**"
      run: pnpm --filter admin format
    admin-lint:
      glob: "frontend/admin/**"
      run: pnpm --filter admin lint
    admin-type-check:
      glob: "frontend/admin/**"
      run: pnpm --filter admin type-check
    mobile-format:
      glob: "frontend/mobile/**"
      run: pnpm --filter mobile format
    mobile-lint:
      glob: "frontend/mobile/**"
      run: pnpm --filter mobile lint
    mobile-type-check:
      glob: "frontend/mobile/**"
      run: pnpm --filter mobile type-check
pre-commit:
  parallel: true
  commands:
    admin-format-write:
      glob: "frontend/admin/**"
      run: pnpm --filter admin format:write
      stage_fixed: true
    admin-lint-fix:
      glob: "frontend/admin/**"
      run: pnpm --filter admin lint:fix
      stage_fixed: true
    mobile-format-write:
      glob: "frontend/mobile/**"
      run: pnpm --filter mobile format:write
      stage_fixed: true
    mobile-lint-fix:
      glob: "frontend/mobile/**"
      run: pnpm --filter mobile lint:fix
      stage_fixed: true
