services:
  nginx:
    image: nginx:alpine
    container_name: ctrip-yisu-hotel-nginx
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${HOME}/ssl/cf:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - backend 

  app:
    image: ${APP_IMAGE:ghcr.io/floatdreamwithsong/ctrip-yisu-hotel-backend:latest}
    container_name: ctrip-yisu-hotel-be
    restart: always
    env_file:
      - path: .env
        required: false
      - path: .env.production
        required: false
      - path: .env.production.local  # 生产密钥，在服务器上手动管理，不入仓库
        required: false
    expose:
      - '8000'
    depends_on:
      - db
      - redis
    networks:
      - backend
    entrypoint: ['/bin/sh', 'docker-entrypoint.sh']

  db:
    image: postgres:15-alpine
    container_name: ctrip-yisu-hotel-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ctrip-yisu-hotel
    ports:
      - '5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: ctrip-yisu-hotel-redis
    restart: always
    ports:
      - '6379'
    networks:
      - backend

volumes:
  db_data:

networks:
  backend:
    driver: bridge
