server {
    listen 80;
    server_name _;

    # HTTP 重定向到 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/ssl/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 高德地图自定义样式接口代理（如未使用可保留，不影响）
    location /_AMapService/v4/map/styles {
        set $args "${args}&jscode=${AMAP_SECURITY_JSCODE}";
        proxy_pass https://webapi.amap.com/v4/map/styles;
        proxy_ssl_server_name on;
        proxy_set_header Host webapi.amap.com;
    }

    # 高德 Web 服务 API 代理（前端 _AMapSecurityConfig.serviceHost 指向此路径）
    location /_AMapService/ {
        set $args "${args}&jscode=${AMAP_SECURITY_JSCODE}";
        proxy_pass https://restapi.amap.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host restapi.amap.com;
    }

    location / {
        resolver 127.0.0.11 valid=30s;
        set $upstream http://app:8000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
